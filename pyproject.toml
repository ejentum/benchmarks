[project]
name = "ejentum-benchmarks"
version = "0.1.0"
description = "Inspect AI task wrappers for the ejentum/benchmarks suite."
readme = "README.md"
license = { text = "CC-BY-4.0" }
requires-python = ">=3.10"
dependencies = [
    "inspect_ai>=0.3.0",
]

[project.urls]
Repository = "https://github.com/ejentum/benchmarks"
Homepage = "https://ejentum.com"
Documentation = "https://ejentum.com/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elephant_inspect"]

# Include the bundled scenarios.json so the task is runnable straight from
# an installed wheel as well as from a source checkout.
[tool.hatch.build.targets.wheel.shared-data]
"elephant/scenarios.json" = "share/ejentum-benchmarks/elephant/scenarios.json"
